services:
  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx-all-in-one:latest
    container_name: base-hyperdx
    restart: unless-stopped
    ports:
      - "8090:8080"   # UI (8080 conflicts with API)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - hyperdx_db:/data/db
      - hyperdx_ch_data:/var/lib/clickhouse
      - hyperdx_ch_logs:/var/log/clickhouse-server
    environment:
      - USAGE_STATS_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: base-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_HYPERDX_API_KEY=${HYPERDX_API_KEY:-}
      - VITE_HYPERDX_ENDPOINT=http://localhost:4318
    depends_on:
      - api

  goose:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: base-goose
    command: ["-dir", "/migrations", "postgres", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-base}?sslmode=disable", "up"]
    volumes:
      - ./database/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: base-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-base}
      POSTGRES_SSL_MODE: disable
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION: ${DYNAMO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:5173/auth/google/callback}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://hyperdx:4318
      OTEL_SERVICE_NAME: base2-api
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: authorization=${HYPERDX_API_KEY:-}
    depends_on:
      goose:
        condition: service_completed_successfully
      dynamodb:
        condition: service_started
      redis:
        condition: service_healthy
      hyperdx:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-base}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-base}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: base-dynamodb
    restart: unless-stopped
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    ports:
      - "${DYNAMO_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/data
    working_dir: /home/dynamodblocal

  redis:
    image: redis:7-alpine
    container_name: base-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  dynamodb_data:
  redis_data:
  hyperdx_db:
  hyperdx_ch_data:
  hyperdx_ch_logs:
